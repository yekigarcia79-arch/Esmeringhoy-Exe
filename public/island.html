<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmeringhoy Dynamic Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/island.css?v=20261113c">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18.6 4.9 7.4 12l11.2 7.1z" fill="currentColor" stroke="none"/><path d="M4.6 4.8v14.4" stroke-width="2.6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.4 4.9 16.6 12 5.4 19.1z" fill="currentColor" stroke="none"/><path d="M19.4 4.8v14.4" stroke-width="2.6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.6 4.6 19.8 12 7.6 19.4z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7.2" y="4.6" width="3.4" height="14.8" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.4" y="4.6" width="3.4" height="14.8" rx="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
</svg>

<main id="island" role="region" aria-label="Now playing">
  <div class="top">
    <img id="art" class="art" width="38" height="38" alt="" draggable="false"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%231f1f1f'/%3E%3Ccircle cx='40' cy='40' r='19' fill='none' stroke='%237e7e7e' stroke-width='1.6'/%3E%3Ccircle cx='40' cy='40' r='6.5' fill='none' stroke='%237e7e7e' stroke-width='1.6'/%3E%3Ccircle cx='40' cy='40' r='1.8' fill='%23a8a8a8'/%3E%3C/svg%3E">
    <div class="meta">
      <div id="title" class="title" aria-live="polite">Nothing playing</div>
      <div id="artist" class="artist">Esmeringhoy</div>
    </div>
    <div id="wave" class="wave" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
  </div>

  <div class="progress">
    <span id="elapsed" class="time">0:00</span>
    <div id="seek" class="seek" role="slider" tabindex="0" aria-label="Playback position"
      aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
      <div class="seek-track">
        <div id="fill" class="seek-fill"></div>
        <div id="thumb" class="seek-thumb"></div>
      </div>
    </div>
    <span id="remaining" class="time end">-0:00</span>
  </div>

  <div class="controls">
    <span class="spacer" aria-hidden="true"></span>
    <div class="cluster">
      <button id="prev" class="icon-btn" type="button" aria-label="Previous track">
        <svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg>
      </button>
      <button id="play" class="play-btn" type="button" aria-label="Play">
        <svg class="ic" aria-hidden="true"><use id="playUse" href="#i-play"/></svg>
      </button>
      <button id="next" class="icon-btn" type="button" aria-label="Next track">
        <svg class="ic" aria-hidden="true"><use href="#i-next"/></svg>
      </button>
    </div>
    <button id="output" class="output" type="button" aria-label="Mute">
      <svg class="ic" aria-hidden="true"><use id="outUse" href="#i-volume"/></svg>
      <span id="vol" class="vol">70</span>
    </button>
  </div>
</main>

<script src="/js/island.js?v=20261113b"></script>
</body>
</html>
