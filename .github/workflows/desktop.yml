name: Build desktop (NSIS + MSI)

# Tag-triggered release build for Windows. Produces the NSIS and MSI
# installers as workflow artifacts. Code signing is not configured — add a
# certificate thumbprint to bundle.windows when you have one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x" # WiX tooling chain for the MSI bundle

      - name: Install frontend toolchain
        run: npm ci --prefix desktop

      - name: Build installers
        run: npm --prefix desktop run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: esmeringhoy-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
